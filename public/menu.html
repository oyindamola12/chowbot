<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Menu – ChowBot</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}
body {
  background: #fffaf5;
  padding: 20px;
}
nav {
  background: white;
  padding: 15px 30px;
  border-radius: 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
nav h2 {
  color: #ff5a3c;
}
nav a {
  background: #ff5a3c;
  color: white;
  padding: 8px 18px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: 500;
}
.container {
  max-width: 1000px;
  margin: auto;
}
.card {
  background: white;
  border-radius: 24px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}
h2 {
  margin-bottom: 20px;
  color: #1e293b;
}
.form-group {
  margin-bottom: 15px;
}
input, textarea {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid #ddd;
  border-radius: 30px;
  font-size: 14px;
}
button {
  background: #ff5a3c;
  color: white;
  border: none;
  padding: 10px 24px;
  border-radius: 30px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}
button:hover {
  background: #e04e2e;
}
.item-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.menu-item {
  background: #f8fafc;
  border-radius: 20px;
  padding: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  border: 1px solid #e2e8f0;
}
.menu-item input {
  flex: 1;
  min-width: 120px;
}
.menu-item img {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 12px;
}
.actions {
  display: flex;
  gap: 8px;
}
.delete-btn {
  background: #ef4444;
}
.delete-btn:hover {
  background: #dc2626;
}
.success {
  background: #d1fae5;
  color: #065f46;
  padding: 12px;
  border-radius: 30px;
  text-align: center;
  margin-top: 20px;
}
.error {
  background: #fee2e2;
  color: #b91c1c;
}
</style>
</head>
<body>

<nav>
  <h2>🍽 ChowBot Menu Manager</h2>
  <a href="index.html">🏠 Home</a>
</nav>

<div class="container">
  <div class="card">
    <h2>📋 Your Menu</h2>
    <div id="apiKeyDisplay" style="background:#f1f5f9; padding:10px; border-radius:20px; margin-bottom:20px;"></div>
    <div id="menuList" class="item-list">Loading...</div>
  </div>

  <div class="card">
    <h2>➕ Add New Item</h2>
    <div class="form-group">
      <input type="text" id="itemName" placeholder="Item name">
    </div>
    <div class="form-group">
      <input type="number" id="itemPrice" placeholder="Price (₦)">
    </div>
    <div class="form-group">
      <input type="text" id="itemImage" placeholder="Image URL (optional)">
    </div>
    <button onclick="addItem()">Add Item</button>
  </div>

  <div id="message"></div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const apiKey = urlParams.get("apiKey");

if (!apiKey) {
  document.getElementById("apiKeyDisplay").innerHTML = "<span style='color:red'>❌ No API key provided. Please register first.</span>";
} else {
  document.getElementById("apiKeyDisplay").innerHTML = `<strong>API Key:</strong> <code>${apiKey}</code>`;
  loadMenu();
}

async function loadMenu() {
  const container = document.getElementById("menuList");
  container.innerHTML = "Loading menu...";
  try {
    const res = await fetch(`https://chowbot-kgdk.onrender.com/get-menu/${apiKey}`);
    if (!res.ok) throw new Error("Failed to load");
    const items = await res.json();
    if (items.length === 0) {
      container.innerHTML = "<p style='text-align:center'>No items yet. Add your first item below.</p>";
      return;
    }
    container.innerHTML = "";
    items.forEach(item => {
      const div = document.createElement("div");
      div.className = "menu-item";
      div.innerHTML = `
        <img src="${item.image || 'https://via.placeholder.com/60'}" onerror="this.src='https://via.placeholder.com/60'">
        <input type="text" value="${escapeHtml(item.name)}" id="name-${item.id}" placeholder="Name">
        <input type="number" value="${item.price}" id="price-${item.id}" placeholder="Price">
        <input type="text" value="${item.image || ''}" id="image-${item.id}" placeholder="Image URL">
        <div class="actions">
          <button onclick="updateItem('${item.id}')">💾 Save</button>
          <button class="delete-btn" onclick="deleteItem('${item.id}')">🗑 Delete</button>
        </div>
      `;
      container.appendChild(div);
    });
  } catch (err) {
    console.error(err);
    container.innerHTML = "<p style='color:red'>Error loading menu. Check API key.</p>";
  }
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

async function addItem() {
  const name = document.getElementById("itemName").value.trim();
  const price = document.getElementById("itemPrice").value.trim();
  const image = document.getElementById("itemImage").value.trim();
  if (!name || !price) {
    showMessage("⚠️ Name and price required", "error");
    return;
  }
  showMessage("⏳ Adding...", "success");
  try {
    const res = await fetch("https://chowbot-kgdk.onrender.com/add-item", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ apiKey, name, price: Number(price), image })
    });
    const data = await res.json();
    if (data.success) {
      showMessage("✅ Item added!", "success");
      document.getElementById("itemName").value = "";
      document.getElementById("itemPrice").value = "";
      document.getElementById("itemImage").value = "";
      loadMenu();
    } else {
      showMessage("❌ " + (data.message || "Failed"), "error");
    }
  } catch (err) {
    showMessage("❌ Server error", "error");
  }
}

async function updateItem(itemId) {
  const name = document.getElementById(`name-${itemId}`).value.trim();
  const price = document.getElementById(`price-${itemId}`).value.trim();
  const image = document.getElementById(`image-${itemId}`).value.trim();
  if (!name || !price) {
    showMessage("⚠️ Name and price cannot be empty", "error");
    return;
  }
  try {
    const res = await fetch("https://chowbot-kgdk.onrender.com/update-item", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ apiKey, itemId, name, price: Number(price), image })
    });
    const data = await res.json();
    if (data.success) {
      showMessage("✅ Item updated", "success");
      loadMenu();
    } else {
      showMessage("❌ Update failed", "error");
    }
  } catch (err) {
    showMessage("❌ Server error", "error");
  }
}

async function deleteItem(itemId) {
  if (!confirm("Delete this item?")) return;
  try {
    const res = await fetch("https://chowbot-kgdk.onrender.com/delete-item", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ apiKey, itemId })
    });
    const data = await res.json();
    if (data.success) {
      showMessage("🗑 Item deleted", "success");
      loadMenu();
    } else {
      showMessage("❌ Delete failed", "error");
    }
  } catch (err) {
    showMessage("❌ Server error", "error");
  }
}

function showMessage(msg, type) {
  const msgDiv = document.getElementById("message");
  msgDiv.innerHTML = `<div class="success ${type === 'error' ? 'error' : ''}">${msg}</div>`;
  setTimeout(() => msgDiv.innerHTML = "", 3000);
}
</script>
</body>
</html>
