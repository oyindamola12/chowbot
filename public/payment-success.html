<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0fdf4; }
        h1 { color: #166534; }
        p { margin-top: 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #22c55e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>✅ Payment Successful!</h1>
    <div class="loader"></div>
    <p>Redirecting you back to WhatsApp...</p>
    <p>If you are not redirected automatically, <a id="whatsappLink" href="#">click here</a>.</p>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const phone = urlParams.get('phone'); // expected in format "whatsapp:+234..."

        // Remove 'whatsapp:' prefix if present
        let rawPhone = phone;
        if (rawPhone.startsWith('whatsapp:')) rawPhone = rawPhone.substring(9);
        // Ensure country code is there (assume 234 if not)
        if (!rawPhone.startsWith('234')) rawPhone = '234' + rawPhone.replace(/^0+/, '');

        const message = encodeURIComponent(`🎉 Order #${orderId?.slice(-6) || 'N/A'} payment confirmed! We'll notify you when it's being prepared.`);
        const waLink = `https://wa.me/${rawPhone}?text=${message}`;

        const link = document.getElementById('whatsappLink');
        link.href = waLink;
        setTimeout(() => {
            window.location.href = waLink;
        }, 3000);
    </script>
</body>
</html>
